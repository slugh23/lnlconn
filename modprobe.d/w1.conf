#
# Options for the 1-Wire core module ("wire"); install as
# /etc/modprobe.d/w1.conf.  They take effect when the module is loaded, so
# reload it (modprobe -r w1_ds2431 ds2490 wire) or reboot after changing them.
#
# search_count=0  no periodic slave search; devices are found by searching
#                 over the netlink connector instead.
# slave_ttl=1     drop a slave after one search that misses it (only matters
#                 if searching is re-enabled with w1_master_search).
options wire slave_ttl=1 search_count=0
